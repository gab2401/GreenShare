server.port=8080

# Connessione PostgreSQL (sostituisci dbname, username e password con i tuoi locali)[cite: 216]
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Gestione Schema DDL tramite Hibernate: 'update' aggiorna le tabelle in automatico[cite: 216]
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Parametri Sessione e Cookie da slide del corso[cite: 234]
server.servlet.session.cookie.name=GREENSHARE_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false